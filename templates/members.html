{% extends "base.html" %}
{% block content %}
<div class="toolbar">
  <h2>Members</h2>
  <a class="btn" href="{{ url_for('add_member') }}">+ Add Member</a>
</div>

<table>
  <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Joined on</th><th>Books held</th><th>Actions</th></tr>
  {% for m in members %}
  <tr>
    <td>{{ m.member_id }}</td>
    <td>{{ m.name }}</td>
    <td>{{ m.email }}</td>
    <td>{{ m.phone }}</td>
    <td>{{ m.joined_on }}</td>
    <td>{{ m.books_held }}</td>
    <td class="actions">
      <a class="btn small" href="{{ url_for('edit_member', member_id=m.member_id) }}">Edit</a>
      <form method="post" action="{{ url_for('delete_member', member_id=m.member_id) }}"
            onsubmit="return confirm('Delete this member?')">
        <button class="btn small danger">Delete</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="7">No members yet.</td></tr>
  {% endfor %}
</table>
{% endblock %}
