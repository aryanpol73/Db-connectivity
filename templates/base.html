<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Library Management System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>📚 Library Management System</h1>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('books') }}"     class="{{ 'active' if 'book' in request.endpoint }}">Books</a>
      <a href="{{ url_for('members') }}"   class="{{ 'active' if 'member' in request.endpoint }}">Members</a>
      <a href="{{ url_for('issues') }}"    class="{{ 'active' if 'issue' in request.endpoint or 'return' in request.endpoint }}">Issue / Return</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer>DBMS Mini Project &middot; Python (Flask) + MySQL</footer>
</body>
</html>
