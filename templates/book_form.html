{% extends "base.html" %}
{% block content %}
<h2>{{ 'Edit Book' if book else 'Add Book' }}</h2>
<form class="form" method="post">
  <label>Title <input name="title" required value="{{ book.title if book }}"></label>
  <label>Author <input name="author" required value="{{ book.author if book }}"></label>
  <label>Category <input name="category" value="{{ book.category if book }}"></label>
  <label>Quantity <input name="quantity" type="number" min="1" required value="{{ book.quantity if book else 1 }}"></label>
  <div>
    <button class="btn">Save</button>
    <a href="{{ url_for('books') }}">Cancel</a>
  </div>
</form>
{% endblock %}
